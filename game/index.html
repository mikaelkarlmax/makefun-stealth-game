<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOW PROTOCOL — a top-down stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a12; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: 1280px; height: 800px; max-width: 100vw; max-height: 100vh; display: block; touch-action: none; background: #070a12; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Shadow Protocol: a top-down stealth game. Stay out of the guards' vision cones, grab the keycard and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./src/util.js"></script>
<script src="./src/level.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/input.js"></script>
<script src="./src/player.js"></script>
<script src="./src/guards.js"></script>
<script src="./src/render.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
